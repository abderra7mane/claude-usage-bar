name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Build
        run: make dist VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ClaudeUsageBar.zip --title "$GITHUB_REF_NAME" --generate-notes
